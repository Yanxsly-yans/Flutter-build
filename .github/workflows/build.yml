name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project"
        required: true
      tag:
        description: "Tag release"
        required: true
      build_type:
        description: "release / debug"
        required: false
        default: "release"
  repository_dispatch:
    types: [flutter_build]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download dan ekstrak ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.zip_url || inputs.zip_url }}
          TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dl src
          test -n "$ZIP_URL"
          if printf '%s' "$ZIP_URL" | grep -q '^https://api.github.com/repos/'; then
            gh api "$ZIP_URL" --jq '.content' | base64 --decode > dl/project.zip
          else
            curl --fail --location --retry 3 --retry-delay 2 -o dl/project.zip "$ZIP_URL"
          fi
          unzip -q dl/*.zip -d src
          PUB=$(find src -name pubspec.yaml -not -path "*/.*" -not -path "*/build/*" | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$PUB" ]; then echo "pubspec.yaml tidak ditemukan di ZIP"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$PUB")" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          BUILD_TYPE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.build_type || inputs.build_type }}
        run: |
          set -euo pipefail
          flutter pub get
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
